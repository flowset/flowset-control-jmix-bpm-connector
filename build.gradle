buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath "io.jmix.gradle:jmix-gradle-plugin:3.0.0"
    }
}

group = 'io.flowset.control'
version = '0.0.1-SNAPSHOT'

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'io.jmix'

    repositories {
        mavenCentral()
        maven {
            url = 'https://global.repo.jmix.io/repository/public'
        }
        maven {
            url = 'https://global.repo.jmix.io/repository/premium'
            credentials {
                username = rootProject['premiumRepoUser']
                password = rootProject['premiumRepoPass']
            }
        }
    }

    jmix {
        bomVersion = '3.0.0'
        projectId = 'ctrint'
    }

    group = this.group
    version = this.version

    java {
        withSourcesJar()
    }

    artifacts {
        archives sourcesJar
    }

    afterEvaluate {
        publishing {
            repositories {
                maven {
                    url = 'https://myrepo/releases/'
                    credentials {
                        username rootProject.hasProperty('uploadUser') ? rootProject['uploadUser'] : 'admin'
                        password rootProject.hasProperty('uploadPassword') ? rootProject['uploadPassword'] : 'admin'
                    }
                    allowInsecureProtocol = true
                }
            }
            publications {
                javaMaven(MavenPublication) {
                    artifactId = project.base.archivesName.get()
                    from components.java
                }
            }
        }
    }

    // remove after https://youtrack.jetbrains.com/issue/IDEA-227215 is fixed
    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }

    project.tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add("-parameters")
    }
}
